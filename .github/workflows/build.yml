name: Build Release APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Generate keystore
        run: |
          keytool -genkeypair -keystore "$GITHUB_WORKSPACE/release.jks" -alias key \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android123 -keypass android123 -dname "CN=Showcase"
      - name: Build release (R8 + shrink)
        env:
          KS_PATH: ${{ github.workspace }}/release.jks
          KS_PASS: android123
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Upload to Telegram
        env:
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          curl -sS -F chat_id="$TG_CHAT_ID" \
            -F document=@"$APK" \
            -F caption="About Device Showcase (release) - ${GITHUB_SHA::7}" \
            "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument"
